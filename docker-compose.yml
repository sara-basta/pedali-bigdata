# Pedali.ma - Kafka (KRaft) + Spark 3.5.3 (1 Master, 2 Workers) + MinIO + Jupyter
# Lancement : docker compose up -d --build

# Image construite une seule fois (par spark-master), réutilisée par les autres
x-spark: &spark
  image: pedali/spark:3.5.3-py3.11
  pull_policy: never
  volumes:
    - ./:/opt/pedali
  networks: [pedali]

x-spark-worker: &spark-worker
  <<: *spark
  depends_on: [spark-master]
  environment:
    SPARK_WORKER_CORES: 2
    SPARK_WORKER_MEMORY: 2g
  command: ["spark-class", "org.apache.spark.deploy.worker.Worker",
            "--webui-port", "8081", "spark://spark-master:7077"]

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10
    networks: [pedali]

  # Crée le topic "trips" (3 partitions) puis s'arrête
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic trips --partitions 3 --replication-factor 1
    networks: [pedali]

  # MinIO ne publie plus d'image officielle : image Bitnami archivée (même logiciel)
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    ports: ["9000:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: lake          # crée le bucket "lake" au démarrage
    volumes:
      - minio-data:/bitnami/minio/data
    networks: [pedali]

  # Console web MinIO (séparée de MinIO dans les images Bitnami)
  minio-console:
    image: bitnamilegacy/minio-object-browser:2.0.2-debian-12-r4
    container_name: minio-console
    depends_on: [minio]
    command: ["server"]
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
    ports: ["9001:9090"]
    networks: [pedali]

  spark-master:
    <<: *spark
    build: ./docker/spark
    pull_policy: missing      # reconstruit seulement si l'image manque (ou avec --build)
    container_name: spark-master
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["8080:8080"]

  spark-worker-1:
    <<: *spark-worker
    container_name: spark-worker-1
    hostname: spark-worker-1
    ports: ["8081:8081"]

  spark-worker-2:
    <<: *spark-worker
    container_name: spark-worker-2
    hostname: spark-worker-2
    ports: ["8082:8081"]

  # Driver Spark : on y lance le code des Parties 1 à 6
  jupyter:
    <<: *spark
    container_name: jupyter
    hostname: jupyter
    depends_on: [spark-master, kafka, minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--allow-root", "--no-browser",
              "--ServerApp.token=", "--notebook-dir=/opt/pedali"]
    ports: ["8888:8888", "4040:4040"]

volumes:
  kafka-data:
  minio-data:

networks:
  pedali:
    name: pedali
